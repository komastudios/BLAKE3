name: main

on:
  push:
    branches: [ "unity" ]
  pull_request:
    branches: [ "unity" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}

    defaults:
      run:
        shell: ${{ matrix.platform.shell }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: "Linux (GCC)", artifact: "linux-x64", os: ubuntu-22.04, shell: bash }
          - { name: "macOS (Clang)", artifact: "macos-universal", os: macos-14, shell: bash, universal: true }
          - { name: "Windows (MSVC)", artifact: "windows-x64", os: windows-2022, shell: pwsh, flags: "-A x64 -DUSE_MSVC_STATIC_RUNTIME=ON" }
          - { name: "Windows (GCC)", artifact: "windows-x64-mingw", os: windows-2022, shell: 'msys2 {0}', msystem: mingw64, msys-env: mingw-w64-x86_64 }

    steps:
    - name: Set up MSYS2
      if: matrix.platform.shell == 'msys2 {0}'
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.platform.msystem }}
        install: >-
          ${{ matrix.platform.msys-env }}-gcc
          ${{ matrix.platform.msys-env }}-cmake
          ${{ matrix.platform.msys-env }}-ninja

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure CMake (arm64)
      if: matrix.platform.universal
      run: cmake -S . -B build-arm64 -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -GXcode -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

    - name: Build (arm64)
      if: matrix.platform.universal
      run: cmake --build build-arm64 --config ${{env.BUILD_TYPE}}

    - name: Install (arm64)
      if: matrix.platform.universal
      run: cmake --install build-arm64 --config ${{env.BUILD_TYPE}} --prefix dist-arm64

    - name: Configure CMake (x86_64)
      if: matrix.platform.universal
      run: cmake -S . -B build-x86_64 -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -GXcode -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

    - name: Build (x86_64)
      if: matrix.platform.universal
      run: cmake --build build-x86_64 --config ${{env.BUILD_TYPE}}

    - name: Install (x86_64)
      if: matrix.platform.universal
      run: cmake --install build-x86_64 --config ${{env.BUILD_TYPE}} --prefix dist-x86_64

    - name: Create universal binary
      if: matrix.platform.universal
      run: |
        mkdir -p dist/lib dist/include
        lipo -create dist-arm64/lib/libblake3-static.a dist-x86_64/lib/libblake3-static.a -output dist/lib/libblake3-static.a
        lipo -create dist-arm64/lib/libblake3.dylib dist-x86_64/lib/libblake3.dylib -output dist/lib/libblake3.dylib
        cp dist-arm64/include/blake3.h dist/include/
        lipo -info dist/lib/libblake3-static.a
        lipo -info dist/lib/libblake3.dylib

    - name: Configure CMake
      if: ${{ !matrix.platform.universal }}
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} ${{ matrix.platform.flags }}

    - name: Build
      if: ${{ !matrix.platform.universal }}
      run: cmake --build build --config ${{env.BUILD_TYPE}}

    - name: Install
      if: ${{ !matrix.platform.universal }}
      run: cmake --install build --config ${{env.BUILD_TYPE}} --prefix dist

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.platform.artifact }}
        path: dist
